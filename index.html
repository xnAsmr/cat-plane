<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>喵机长 · 云端巡航</title>
<style>
:root{
  --mx:0; --my:0; --rate:1;
  --cloud:#ffffff;
  --hill-back:#bfe6d8;
  --hill-front:#79bfa3;
  --star-opacity:0;
  --sun:#ffd76a;
  --sun-glow:rgba(255,214,110,.55);
  --cut-x:0px; --cut-y:0px; --cut-color:transparent;
  --line:rgba(255,255,255,.8);
  --ui-bg:rgba(255,255,255,.22);
  --ui-border:rgba(255,255,255,.6);
  --ui-text:#26365c;
  --hud-bg:rgba(255,255,255,.24);
}
[data-theme="sunset"]{
  --cloud:#fff1df;
  --hill-back:#c9a3ba;
  --hill-front:#8d6b9e;
  --sun:#ff9d61;
  --sun-glow:rgba(255,155,95,.6);
  --ui-text:#402849;
  --line:rgba(255,255,255,.7);
}
[data-theme="night"]{
  --cloud:#93a7d6;
  --hill-back:#3c4c80;
  --hill-front:#24315d;
  --star-opacity:1;
  --sun:#f7f2d2;
  --sun-glow:rgba(190,215,255,.32);
  --cut-x:-20px; --cut-y:6px; --cut-color:#16225a;
  --line:rgba(200,225,255,.65);
  --ui-bg:rgba(18,30,70,.42);
  --ui-border:rgba(190,210,255,.35);
  --ui-text:#eef4ff;
  --hud-bg:rgba(18,30,70,.42);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  overflow:hidden;background:#7cc4f7;
  -webkit-font-smoothing:antialiased;
}
.scene{position:relative;width:100%;height:100%;min-height:100dvh;overflow:hidden;isolation:isolate;--rate:1;color:var(--ui-text)}
.scene.boost{--rate:.55}

.sky{position:absolute;inset:0;transition:opacity 1s ease}
.sky.day{background:linear-gradient(180deg,#3d8fe8 0%,#7cc4f7 48%,#e2f4ff 100%)}
.sky.sunset{background:linear-gradient(180deg,#66569c 0%,#ff9a76 52%,#ffe2b6 100%);opacity:0}
.sky.night{background:linear-gradient(180deg,#0d1640 0%,#213566 55%,#4a5c95 100%);opacity:0}
[data-theme="sunset"] .sky.sunset{opacity:1}
[data-theme="night"] .sky.night{opacity:1}

.stars{position:absolute;inset:0;opacity:var(--star-opacity);transition:opacity 1s;pointer-events:none}
.star-dot{
  position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);
  border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.55);
  animation:twinkle var(--t) ease-in-out infinite alternate;animation-delay:var(--d);
}
@keyframes twinkle{from{opacity:.12;transform:scale(.55)}to{opacity:1;transform:scale(1.2)}}

.sun{
  position:absolute;right:12%;top:11%;width:clamp(72px,9vw,132px);aspect-ratio:1;border-radius:50%;
  background:var(--sun);
  box-shadow:inset var(--cut-x) var(--cut-y) 0 0 var(--cut-color),0 0 70px 22px var(--sun-glow);
  transition:background .9s,box-shadow .9s;
  animation:sunPulse 6s ease-in-out infinite;
}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.cloud-layer{
  position:absolute;inset:0;pointer-events:none;
  transform:translate3d(calc(var(--mx) * var(--dx)),calc(var(--my) * var(--dy)),0);
  transition:transform .35s ease-out;
}
.layer-back{--dx:10px;--dy:5px}
.layer-mid{--dx:20px;--dy:10px}
.layer-front{--dx:34px;--dy:16px}
.cloud{
  position:absolute;left:0;top:var(--top);width:var(--w);height:calc(var(--w) * .3);
  border-radius:999px;background:var(--cloud);opacity:var(--o);
  filter:drop-shadow(0 14px 18px rgba(43,70,125,.14));
  transition:background .9s;
  animation:drift calc(var(--dur) * var(--rate)) linear infinite;
  animation-delay:calc(var(--dur) * var(--rate) * var(--off));
}
[data-theme="night"] .cloud{opacity:calc(var(--o) * .6)}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:52%;height:155%;left:14%;bottom:10%}
.cloud::after{width:38%;height:120%;left:52%;bottom:6%}
@keyframes drift{from{transform:translateX(105vw)}to{transform:translateX(-32vw)}}

.hills{
  position:absolute;left:-10%;bottom:0;width:120%;pointer-events:none;
  transform:translate3d(calc(var(--mx) * var(--d)),0,0);transition:transform .4s ease-out;
}
.hills svg{display:block;width:100%;height:100%}
.hills path{transition:fill .9s}
.hills.back{height:42%;--d:10px;opacity:.8}
.hills.back path{fill:var(--hill-back)}
.hills.front{height:27%;--d:22px}
.hills.front path{fill:var(--hill-front)}

.speed-lines{position:absolute;inset:0;pointer-events:none;opacity:.3;transition:opacity .4s}
.scene.boost .speed-lines{opacity:.9}
.speed-lines i{
  position:absolute;left:0;top:var(--t);width:var(--w);height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
  animation:dash calc(var(--d) * var(--rate)) linear infinite;animation-delay:var(--dl);
}
@keyframes dash{from{transform:translateX(105vw)}to{transform:translateX(-32vw)}}

.plane-anchor{
  position:absolute;left:50%;top:46%;width:clamp(330px,46vw,640px);z-index:4;
  transform:translate(-50%,-50%);pointer-events:none;
}
.plane-parallax{
  transform:translate3d(calc(var(--mx) * 26px),calc(var(--my) * 16px),0) rotate(var(--tilt,-2deg));
  transition:transform .35s ease-out;
}
.scene.boost .plane-parallax{--tilt:-6deg}
.plane-bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-9px) rotate(-1deg)}50%{transform:translateY(11px) rotate(1deg)}}
.plane{display:block;width:100%;height:auto;filter:drop-shadow(0 24px 22px rgba(30,55,105,.22))}
.trail{position:absolute;left:-4%;top:56%;width:26%;height:22%;pointer-events:none}
.trail i{
  position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;
  background:rgba(255,255,255,.8);box-shadow:0 0 0 7px rgba(255,255,255,.22);
  animation:puff calc(2.2s * var(--rate)) ease-out infinite;animation-delay:var(--dl);
}
.trail i:nth-child(1){--x:62%;--y:8%;--s:14px;--dl:0s}
.trail i:nth-child(2){--x:34%;--y:42%;--s:20px;--dl:-.75s}
.trail i:nth-child(3){--x:6%;--y:76%;--s:13px;--dl:-1.45s}
@keyframes puff{0%{opacity:0;transform:translateX(0) scale(.5)}25%{opacity:.9}100%{opacity:0;transform:translateX(-70px) scale(1.5)}}

.prop{transform-box:fill-box;transform-origin:center;animation:spin calc(.18s * var(--rate)) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prop-blur{opacity:0;transition:opacity .4s}
.scene.boost .prop-blur{opacity:.5}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.ear{transform-box:fill-box;transform-origin:bottom center;animation:earTwitch 4.2s ease-in-out infinite}
.ear.delay{animation-delay:-2.1s}
@keyframes earTwitch{0%,86%,100%{transform:rotate(0)}92%{transform:rotate(-9deg)}}
.scarf{transform-box:fill-box;transform-origin:right center;animation:flap 1.5s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg) scaleX(1)}50%{transform:rotate(7deg) scaleX(.9)}}
.cat-tail{transform-box:view-box;transform-origin:150px 148px;animation:wag 2.6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}

.ui{
  position:absolute;inset:0;z-index:8;padding:clamp(16px,3vw,38px);
  display:flex;flex-direction:column;justify-content:space-between;gap:18px;pointer-events:none;
}
.topbar,.bottombar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.title-card{
  padding:16px 22px;border-radius:22px;background:var(--ui-bg);border:1px solid var(--ui-border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 45px rgba(31,58,104,.16);transition:background .9s,border-color .9s;
  max-width:min(420px,90vw);
}
.eyebrow{display:block;font-size:11px;letter-spacing:.22em;opacity:.72;margin-bottom:8px}
h1{margin:0;font-size:clamp(20px,2.5vw,32px);letter-spacing:.04em;font-weight:800}
.title-card p{margin:8px 0 0;font-size:13px;opacity:.78}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  pointer-events:auto;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--ui-text);
  padding:10px 16px;border-radius:999px;background:var(--ui-bg);border:1px solid var(--ui-border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 26px rgba(31,58,104,.14);
  transition:transform .2s,background .3s,box-shadow .3s,color .9s;
}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(31,58,104,.22)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
.btn.active{background:rgba(255,255,255,.9);border-color:#fff;color:#26365c}
.btn.primary{
  padding:13px 26px;font-size:14px;color:#fff;border-color:rgba(255,255,255,.55);
  background:linear-gradient(135deg,#ff9a5c,#ff5f7e);box-shadow:0 14px 30px rgba(255,95,126,.35);
}
.btn.primary.active{background:linear-gradient(135deg,#5b8cff,#8f5bff);box-shadow:0 14px 30px rgba(91,140,255,.4)}
.bottombar{align-items:flex-end}
.hud{
  min-width:180px;padding:14px 18px;border-radius:20px;background:var(--hud-bg);
  border:1px solid var(--ui-border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 45px rgba(31,58,104,.16);transition:background .9s,border-color .9s;
}
.hud-row{display:flex;align-items:baseline;gap:8px;font-size:12px;opacity:.85;margin:3px 0}
.hud-row span{width:34px;letter-spacing:.1em}
.hud-row strong{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hud-row small{opacity:.7}
.hud-bar{height:5px;border-radius:5px;background:rgba(255,255,255,.35);margin-top:10px;overflow:hidden}
.hud-bar i{display:block;height:100%;width:50%;border-radius:5px;background:linear-gradient(90deg,#ffd166,#ff6f7d);transition:width .2s}
.center-stack{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;padding-bottom:4px}
.hint{margin:0;font-size:12px;opacity:.75;text-align:center;line-height:1.6}
.badge{
  padding:12px 18px;border-radius:18px;text-align:right;font-size:11px;line-height:1.7;letter-spacing:.14em;
  background:var(--ui-bg);border:1px solid var(--ui-border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:.9;
}
.spark{
  position:absolute;z-index:6;width:16px;height:16px;pointer-events:none;background:#fff3b0;
  clip-path:polygon(50% 0,60% 39%,100% 50%,60% 61%,50% 100%,40% 61%,0 50%,40% 39%);
  filter:drop-shadow(0 0 6px #ffd166);transform:translate(-50%,-50%);
  animation:sparkFly .95s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes sparkFly{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.25) rotate(var(--rot))}
}
@media (max-width:720px){
  .plane-anchor{width:clamp(300px,86vw,480px);top:44%}
  .title-card{padding:12px 16px}
  .title-card p{display:none}
  .badge{display:none}
  .hud{min-width:140px;padding:10px 14px}
  .hud-row strong{font-size:16px}
  .center-stack{order:3;flex-basis:100%}
  .hint{font-size:11px}
  .btn{padding:8px 12px;font-size:12px}
  .btn.primary{padding:11px 20px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .cloud{animation:none;transform:none;left:var(--rest)}
  .speed-lines{display:none}
}
</style>
</head>

  <div class="ui">

      <div class="title-card">
        <span class="eyebrow">CAT AIRLINES · FLIGHT 001</span>

        <p>今天的云，软得像刚出炉的棉花糖。</p>
      </div>
      <div class="controls">
        <button class="btn active" data-set-theme="day">白昼</button>

        <p class="hint">移动鼠标感受云层视差 · 点击天空撒一把星星</p>
      </div>
      <div class="badge">CAT AIR<br>NO. 001<br>云端航线</div>
    </div>
  </div>
</div>

<script>
(function () {
  const scene = document.getElementById('scene');
  const rand = (a, b) => a + Math.random() * (b - a);

  const stars = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.className = 'star-dot';
    s.style.setProperty('--x', rand(0, 100).toFixed(2) + '%');
    s.style.setProperty('--y', rand(2, 72).toFixed(2) + '%');
    s.style.setProperty('--s', rand(2, 4).toFixed(1) + 'px');
    s.style.setProperty('--t', rand(1.6, 4.2).toFixed(2) + 's');
    s.style.setProperty('--d', (-rand(0, 4)).toFixed(2) + 's');
    stars.appendChild(s);
  }

  const cloudConfig = [
    { el: 'cloudBack', count: 5, top: [6, 44], w: [90, 150], dur: [48, 72], o: [.4, .65] },
    { el: 'cloudMid', count: 5, top: [16, 62], w: [130, 210], dur: [32, 48], o: [.7, .9] },
    { el: 'cloudFront', count: 4, top: [54, 82], w: [190, 290], dur: [20, 32], o: [.85, 1] }
  ];
  cloudConfig.forEach(cfg => {
    const box = document.getElementById(cfg.el);
    for (let i = 0; i < cfg.count; i++) {
      const c = document.createElement('div');
      c.className = 'cloud';
      c.style.setProperty('--top', rand(...cfg.top).toFixed(1) + '%');
      c.style.setProperty('--w', rand(...cfg.w).toFixed(0) + 'px');
      c.style.setProperty('--dur', rand(...cfg.dur).toFixed(1) + 's');
      c.style.setProperty('--o', rand(...cfg.o).toFixed(2));
      c.style.setProperty('--off', (-rand(0, 1)).toFixed(3));
      c.style.setProperty('--rest', rand(4, 88).toFixed(1) + '%');
      box.appendChild(c);
    }
  });

  const lines = document.getElementById('speedLines');
  for (let i = 0; i < 8; i++) {
    const l = document.createElement('i');
    l.style.setProperty('--t', rand(10, 88).toFixed(1) + '%');
    l.style.setProperty('--w', rand(60, 190).toFixed(0) + 'px');
    l.style.setProperty('--d', rand(1.2, 2.8).toFixed(2) + 's');
    l.style.setProperty('--dl', (-rand(0, 2.8)).toFixed(2) + 's');
    lines.appendChild(l);
  }

  scene.addEventListener('pointermove', e => {
    scene.style.setProperty('--mx', ((e.clientX / window.innerWidth - .5) * 2).toFixed(3));
    scene.style.setProperty('--my', ((e.clientY / window.innerHeight - .5) * 2).toFixed(3));
  });

  scene.addEventListener('pointerdown', e => {
    if (e.target.closest('.btn')) return;
    for (let i = 0; i < 7; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.style.left = e.clientX + 'px';
      s.style.top = e.clientY + 'px';
      s.style.setProperty('--dx', rand(-90, 90).toFixed(0) + 'px');
      s.style.setProperty('--dy', (-rand(40, 150)).toFixed(0) + 'px');
      s.style.setProperty('--rot', rand(-220, 220).toFixed(0) + 'deg');
      s.style.animationDelay = (i * 0.035).toFixed(2) + 's';
      s.addEventListener('animationend', () => s.remove());
      scene.appendChild(s);
    }
  });

  const themeBtns = Array.from(document.querySelectorAll('[data-set-theme]'));
  themeBtns.forEach(btn => btn.addEventListener('click', () => {
    scene.dataset.theme = btn.dataset.setTheme;
    themeBtns.forEach(b => b.classList.toggle('active', b === btn));
  }));

  let speed = 240, targetSpeed = 240, alt = 3280;
  const boostBtn = document.getElementById('boostBtn');
  boostBtn.addEventListener('click', () => {
    const on = scene.classList.toggle('boost');
    boostBtn.classList.toggle('active', on);
    boostBtn.textContent = on ? '加速中 · 点我减速' : '开启加速';
    targetSpeed = on ? 430 : 240;
  });

  const spdEl = document.getElementById('spd');
  const altEl = document.getElementById('alt');
  const barEl = document.getElementById('spdBar');
  setInterval(() => {
    speed += (targetSpeed - speed) * .08;
    alt += (Math.random() - .5) * 8 + (targetSpeed > 300 ? 1.4 : 0);
    spdEl.textContent = Math.round(speed);
    altEl.textContent = Math.round(alt);
    barEl.style.width = Math.min(100, speed / 480 * 100).toFixed(1) + '%';
  }, 130);
})();
</script>
</body>
</html>
